<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Codex Test</h1>

    <p class="counter" aria-live="polite">
      Contador: <span id="counter-value">0</span>
    </p>

    <div class="buttons" aria-label="Controles do contador">
      <button id="decrement-button" type="button">-1</button>
      <button id="increment-button" type="button">+1</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
